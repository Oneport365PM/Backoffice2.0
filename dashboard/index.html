<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnePort365 Operations Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="shell">
    <!-- Navigation rail -->
    <nav class="rail" aria-label="Main">
      <span class="rail-mark" aria-hidden="true">OP</span>
      <a class="rail-btn active" href="#" aria-current="page" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
      </a>
      <a class="rail-btn" href="#" aria-label="Analytics" title="Analytics">
        <svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M9 16v-5M14 16V8M19 16v-3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </a>
      <span class="rail-spacer"></span>
      <a class="rail-btn" href="#" aria-label="Finance" title="Finance">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1-3 2.4c0 3.3 6 1.8 6 5.1 0 1.4-1.3 2.5-3 2.5s-3-1.1-3-2.5M12 5.5v13" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </a>
    </nav>

    <main class="main">
      <!-- Greeting -->
      <header class="top">
        <div>
          <h1 id="greeting">Good morning, John</h1>
          <p class="today">Today · <span id="todayDate"></span></p>
        </div>
        <div class="notif-wrap">
          <button type="button" class="bell" id="bellBtn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications, 3 unread">
            <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1112 0c0 5 2 6.5 2 6.5H4S6 13 6 8zM10 19a2 2 0 004 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="bell-badge" id="bellBadge">3</span>
          </button>
          <div class="notif-pop" id="notifPop" role="dialog" aria-label="Notifications" hidden>
            <div class="notif-head"><b>Notifications</b><button type="button" class="link" id="markRead">Mark all as read</button></div>
            <ul class="notif-list" id="notifList"></ul>
          </div>
        </div>
      </header>

      <!-- Summary: active work and the four phases -->
      <section class="summary" aria-label="Shipment summary" id="summary"></section>

      <!-- Shipment tracker -->
      <section class="tracker" aria-labelledby="trackerTitle">
        <div class="tracker-head">
          <div class="tracker-title">
            <h2 id="trackerTitle">Shipments</h2>
            <div class="filter-chip" id="filterChip" hidden>
              <span id="filterLabel"></span>
              <button type="button" id="clearFilter" aria-label="Clear filter">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>
          <label class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="search" id="search" placeholder="Search ID or customer" autocomplete="off" />
          </label>
        </div>

        <ul class="legend" aria-label="Legend">
          <li><span class="sw sw-done"></span>Completed</li>
          <li><span class="sw sw-current"></span>In progress</li>
          <li><span class="sw sw-todo"></span>Not started</li>
          <li><span class="sw sw-lost"></span>Lost</li>
          <li><span class="dot dot-error"></span>Delayed or overdue</li>
          <li><span class="dot dot-warning"></span>Waiting on someone</li>
        </ul>

        <div class="table-wrap">
          <div class="track-table">
            <div class="track-row track-header" aria-hidden="true">
              <span>Shipment</span>
              <div class="phases" id="phaseHeaders"></div>
            </div>
            <div id="rows"></div>
          </div>
        </div>

        <footer class="pager">
          <p class="showing" id="showing"></p>
          <div class="pager-right">
            <label class="per-page">Rows per page
              <select id="perPage">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
              </select>
            </label>
            <nav class="pages" id="pages" aria-label="Pages"></nav>
          </div>
        </footer>
      </section>
    </main>
  </div>

  <!-- Shipment detail drawer -->
  <div class="drawer-host" id="drawer" hidden>
    <div class="scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <header class="drawer-head">
        <div>
          <h3 id="drawerTitle"></h3>
          <p id="drawerSub"></p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
